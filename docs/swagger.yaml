basePath: /
definitions:
  model.CreatePresentationResponse:
    properties:
      presentation_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    type: object
  model.CreatePresentionRequestDTO:
    properties:
      polls:
        items:
          $ref: '#/definitions/model.Poll'
        type: array
    type: object
  model.CreateUserRequestDTO:
    properties:
      email:
        example: ada@example.com
        type: string
      name:
        example: Ada Lovelace
        type: string
      password:
        example: s3cretpass
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  model.CreateUserResponseDTO:
    properties:
      email:
        example: ada@example.com
        type: string
      id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      name:
        example: Ada Lovelace
        type: string
    type: object
  model.CreateVoteRequestDTO:
    properties:
      key:
        example: A
        type: string
      player_id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
      poll_id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
    required:
    - key
    - player_id
    - poll_id
    type: object
  model.CreatedPresentationPlayerResponse:
    properties:
      player_id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      player_name:
        example: Ada
        type: string
    type: object
  model.CurrentPoll:
    properties:
      id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      options:
        items:
          $ref: '#/definitions/model.Option'
        type: array
      question:
        example: What is your favourite language?
        type: string
    required:
    - options
    - question
    type: object
  model.ErrorResponse:
    properties:
      error:
        example: The presentation ran out of polls.
        type: string
    type: object
  model.LeaderboardEntry:
    properties:
      answered:
        description: Answered is the number of polls the player voted on.
        example: 4
        type: integer
      player_id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      player_name:
        example: Ada
        type: string
      rank:
        description: Rank starts at 1. Players with the same score share a rank.
        example: 1
        type: integer
      score:
        description: Score is the number of polls answered correctly.
        example: 3
        type: integer
    type: object
  model.LeaderboardResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/model.LeaderboardEntry'
        type: array
      scored_polls:
        description: |-
          ScoredPolls is the highest score possible so far: displayed polls that
          have a correct answer.
        example: 4
        type: integer
    type: object
  model.LoginUserRequestDTO:
    properties:
      email:
        example: ada@example.com
        type: string
      password:
        example: s3cretpass
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  model.LoginUserResponseDTO:
    properties:
      email:
        example: ada@example.com
        type: string
      id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      name:
        example: Ada Lovelace
        type: string
      token:
        type: string
    type: object
  model.MyPresentationResponse:
    properties:
      created_at:
        example: "2026-10-23T14:00:00Z"
        type: string
      current_poll_index:
        example: 1
        type: integer
      has_started:
        example: false
        type: boolean
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      poll_count:
        example: 5
        type: integer
    type: object
  model.Option:
    properties:
      correct:
        description: |-
          Correct marks the right answer when creating a presentation. It is never
          filled in responses (the poll queries do not select it), so players
          cannot see the answer; omitempty keeps it out of the JSON.
        example: true
        type: boolean
      key:
        example: A
        type: string
      value:
        example: Go
        type: string
    required:
    - key
    - value
    type: object
  model.Poll:
    properties:
      options:
        items:
          $ref: '#/definitions/model.Option'
        type: array
      question:
        example: What is your favourite language?
        type: string
    required:
    - options
    - question
    type: object
  model.PresentationResponsePoll:
    properties:
      options:
        items:
          type: object
        type: array
      question:
        type: string
    required:
    - options
    - question
    type: object
  model.PresentationVoteResponse:
    properties:
      is_correct:
        example: true
        type: boolean
      key:
        example: A
        type: string
      player_id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      player_name:
        example: Ada
        type: string
      poll_id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      poll_index:
        example: 1
        type: integer
    type: object
  model.PresentionResponseDTO:
    properties:
      current_poll_index:
        example: 1
        type: integer
      has_started:
        description: HasStarted is false while players can still register.
        example: false
        type: boolean
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      polls:
        items:
          $ref: '#/definitions/model.PresentationResponsePoll'
        type: array
    type: object
  model.RegisterPlayerToPresentation:
    properties:
      player_name:
        example: Ada
        type: string
    required:
    - player_name
    type: object
  model.VoteResponse:
    properties:
      key:
        example: A
        type: string
      player_id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      player_name:
        example: Ada
        type: string
    type: object
info:
  contact: {}
  description: Create presentations made of polls, step through the polls one at a
    time, and collect votes on the poll currently displayed.
  title: Interactive Presentation API
  version: "1.0"
paths:
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /presentations:
    post:
      consumes:
      - application/json
      description: 'Creates a presentation owned by the logged-in user, together with
        its polls and their options. No poll is displayed yet: `current_poll_index`
        starts at 0 until the first `PUT .../polls/current`.'
      parameters:
      - description: The polls of the presentation, in display order
        in: body
        name: presentation
        required: true
        schema:
          $ref: '#/definitions/model.CreatePresentionRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.CreatePresentationResponse'
        "400":
          description: Body is missing mandatory fields, has a wrong type, or contains
            no polls
          schema:
            type: string
        "401":
          description: Missing, invalid or expired access token
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "415":
          description: Content-Type is not application/json
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a presentation
      tags:
      - presentations
  /presentations/{presentation_id}:
    get:
      description: Returns the index of the poll currently displayed, whether the
        presentation has started (`has_started` is false while players can still register),
        and all polls of the presentation. Correct answers are never included.
      parameters:
      - description: Presentation ID
        format: uuid
        in: path
        name: presentation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.PresentionResponseDTO'
            - properties:
                polls:
                  items:
                    $ref: '#/definitions/model.Poll'
                  type: array
              type: object
        "400":
          description: '`presentation_id` is not a valid UUID'
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Presentation not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Get a presentation
      tags:
      - presentations
  /presentations/{presentation_id}/leaderboard:
    get:
      description: Ranks every registered player by the number of polls answered correctly
        (one point per correct vote). Polls without a correct option are not scored.
        Players with the same score share a rank. Only the owner of the presentation
        can do this.
      parameters:
      - description: Presentation ID
        format: uuid
        in: path
        name: presentation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.LeaderboardResponse'
        "400":
          description: Invalid `presentation_id`
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Missing, invalid or expired access token
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: The logged-in user does not own the presentation
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Presentation not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the leaderboard
      tags:
      - votes
  /presentations/{presentation_id}/players:
    get:
      description: Returns every player registered in the presentation, in the order
        they registered.
      parameters:
      - description: Presentation ID
        format: uuid
        in: path
        name: presentation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.CreatedPresentationPlayerResponse'
            type: array
        "400":
          description: Invalid `presentation_id`
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Presentation not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: List the players of a presentation
      tags:
      - players
    post:
      consumes:
      - application/json
      description: Registers a player in a presentation. Registration is only open
        until the presentation starts, and a name can be used only once per presentation.
      parameters:
      - description: Presentation ID
        format: uuid
        in: path
        name: presentation_id
        required: true
        type: string
      - description: The player
        in: body
        name: player
        required: true
        schema:
          $ref: '#/definitions/model.RegisterPlayerToPresentation'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.CreatedPresentationPlayerResponse'
        "400":
          description: Invalid `presentation_id`, invalid body, or empty `player_name`
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Presentation not found or already started, or `player_name`
            already taken
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "415":
          description: Content-Type is not application/json
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Register a player
      tags:
      - players
  /presentations/{presentation_id}/polls/{poll_id}/votes:
    get:
      description: Returns every vote cast on the given poll, ordered by option key.
        Any poll of the presentation can be read, including past ones.
      parameters:
      - description: Presentation ID
        format: uuid
        in: path
        name: presentation_id
        required: true
        type: string
      - description: Poll ID
        format: uuid
        in: path
        name: poll_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.VoteResponse'
            type: array
        "400":
          description: An invalid UUID in the path (empty body)
        "404":
          description: Presentation or poll not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: List the votes of a poll
      tags:
      - votes
  /presentations/{presentation_id}/polls/current:
    get:
      description: Returns the poll that is currently displayed.
      parameters:
      - description: Presentation ID
        format: uuid
        in: path
        name: presentation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.CurrentPoll'
        "400":
          description: No poll is currently displayed. (An invalid `presentation_id`
            also gives 400, with a plain JSON string as body.)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Presentation not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Get the current poll
      tags:
      - polls
    put:
      description: Moves the presentation forward by one poll and returns the poll
        that is now displayed. Only the owner of the presentation can do this.
      parameters:
      - description: Presentation ID
        format: uuid
        in: path
        name: presentation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.CurrentPoll'
        "400":
          description: '`presentation_id` is not a valid UUID, or the presentation
            ran out of polls'
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Missing, invalid or expired access token
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: The logged-in user does not own the presentation
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Presentation not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Display the next poll
      tags:
      - polls
  /presentations/{presentation_id}/polls/current/votes:
    post:
      consumes:
      - application/json
      description: Records one vote of a registered player for an option of the poll
        currently displayed. `poll_id` must be the ID of that poll, and the presentation
        must have started.
      parameters:
      - description: Presentation ID
        format: uuid
        in: path
        name: presentation_id
        required: true
        type: string
      - description: The vote
        in: body
        name: vote
        required: true
        schema:
          $ref: '#/definitions/model.CreateVoteRequestDTO'
      produces:
      - application/json
      responses:
        "204":
          description: Vote recorded
        "400":
          description: Invalid `presentation_id`, invalid body, `poll_id` is not the
            current poll, no poll displayed yet, or unknown option key
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: '`player_id` is not registered in this presentation, or the
            presentation has not started'
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Presentation or poll not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: The player already voted on this poll
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "415":
          description: Content-Type is not application/json
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Any other failure
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Vote on the current poll
      tags:
      - votes
  /presentations/{presentation_id}/start:
    post:
      description: 'Starts the presentation: closes player registration, opens voting
        and displays the first poll. Only the owner of the presentation can do this.'
      parameters:
      - description: Presentation ID
        format: uuid
        in: path
        name: presentation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Presentation started and first poll displayed
        "400":
          description: Invalid `presentation_id`
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Missing, invalid or expired access token
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: The logged-in user does not own the presentation
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Presentation not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Presentation already started
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Start a presentation
      tags:
      - players
  /presentations/{presentation_id}/votes:
    get:
      description: Returns every vote of every poll, ordered by poll, with whether
        each vote was correct. Only the owner of the presentation can do this.
      parameters:
      - description: Presentation ID
        format: uuid
        in: path
        name: presentation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.PresentationVoteResponse'
            type: array
        "400":
          description: Invalid `presentation_id`
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Missing, invalid or expired access token
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: The logged-in user does not own the presentation
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Presentation not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all votes of a presentation
      tags:
      - votes
  /users:
    post:
      consumes:
      - application/json
      description: Creates a user. The password is hashed before it is stored and
        is never returned.
      parameters:
      - description: The new user
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.CreateUserRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.CreateUserResponseDTO'
        "400":
          description: Body is missing mandatory fields, the email is invalid, or
            the password is shorter than 8 characters
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: A user with this email already exists
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "415":
          description: Content-Type is not application/json
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Create a user
      tags:
      - users
  /users/login:
    post:
      consumes:
      - application/json
      description: Checks the email and password and returns the user with a signed
        access token.
      parameters:
      - description: Email and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/model.LoginUserRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.LoginUserResponseDTO'
        "400":
          description: Body is missing mandatory fields or the email is invalid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: The email or password is wrong
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "415":
          description: Content-Type is not application/json
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Log in a user
      tags:
      - users
  /users/me/presentations:
    get:
      description: Returns the presentations owned by the logged-in user, newest first.
      parameters:
      - default: 20
        description: Page size (1-100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of presentations to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.MyPresentationResponse'
            type: array
        "400":
          description: Invalid `limit` or `offset`
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Missing, invalid or expired access token
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my presentations
      tags:
      - presentations
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Type "Bearer " followed by the token returned by POST /users/login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
