services:
  postgres:
    image: postgres:14-alpine
    env_file:
      - app.env
    # Published so that the app can also reach the database when it runs on
    # this machine (with `air`) instead of in the api container.
    ports:
      - "5432:5432"
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - app.env
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    restart: on-failure
    entrypoint:
      [
        "/app/wait-for.sh",
        "postgres:5432",
        "--",
        "/app/main"
      ]
  # The React frontend, served by nginx. It forwards /api to the api service,
  # so the browser only ever talks to http://localhost:3000.
  web:
    build:
      context: ../interactive-presentation-web
    ports:
      - "3000:80"
    depends_on:
      - api
